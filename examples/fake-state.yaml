# Seed for FakeGitOpsBackend (GITOPS_BACKEND=fake). Used by `make run`.
- ocp_cluster: ocp-prod-region-a
  namespace: monitoring
  component: vmstorage
  state:
    cpu_request: "2"
    cpu_limit: "4"
    memory_request: "16Gi"
    memory_limit: "16Gi"
    storage: "500Gi"
    replicas: 3
    annotations: {}
    version: "v1"
