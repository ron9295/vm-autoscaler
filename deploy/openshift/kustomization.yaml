apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy with:  oc diff -k deploy/openshift   (plan)
#               oc apply -k deploy/openshift  (apply)
#
# `namespace` does NOT create the namespace (create it yourself first). It puts every
# object below into it, so an apply can never land in whatever project `oc` has selected.
# If your namespace has another name, change it here and in the Grafana webhook URL
# (http://vm-autoscaler.<namespace>.svc:8080/webhook/grafana).
namespace: vm-autoscaler

labels:
  - pairs:
      app.kubernetes.io/name: vm-autoscaler
      app.kubernetes.io/part-of: victoria-metrics
    includeSelectors: false

resources:
  - configmap.yaml
  # The real Secret is created out of band (sealed-secrets / Vault / oc create secret).
  # secret.example.yaml documents its keys and is NOT applied.
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  # Only if Grafana runs outside this cluster:
  # - route.yaml
  # Use instead of servicemonitor.yaml if you scrape with the VictoriaMetrics operator:
  # - vmservicescrape.yaml

# Production: pin the image by digest instead of a mutable tag. Replace `newTag` with
#   digest: sha256:<digest>      (get it from your registry after the build/push)
# kustomize then renders <newName>@sha256:<digest>.
images:
  - name: vm-autoscaler
    newName: image-registry.openshift-image-registry.svc:5000/vm-autoscaler/vm-autoscaler  # TODO: your registry
    newTag: "0.1.0"
