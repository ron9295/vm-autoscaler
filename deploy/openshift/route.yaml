# Only needed if Grafana runs OUTSIDE this cluster. Otherwise use the Service DNS name.
# Also uncomment the router ingress rule in networkpolicy.yaml.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: vm-autoscaler
  annotations:
    # TODO: REQUIRED - replace with Grafana's real egress IPs/CIDRs, space-separated
    # (e.g. "203.0.113.10/32 203.0.113.11/32"). This placeholder is deliberately NOT a valid
    # CIDR, so it is not a working allowlist and is easy to spot in review. Do not apply as-is.
    haproxy.router.openshift.io/ip_allowlist: "TODO-grafana-egress-ip/32"
spec:
  to:
    kind: Service
    name: vm-autoscaler
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
