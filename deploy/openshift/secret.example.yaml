# EXAMPLE ONLY - placeholders, never commit real values. Create the real secret with e.g.:
#   oc -n vm-autoscaler create secret generic vm-autoscaler-secrets \
#     --from-literal=WEBHOOK_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=GITLAB_TOKEN=... --from-literal=ARGOCD_TOKEN=...
#     (add --from-literal=GITOPS_API_TOKEN=... when GITOPS_BACKEND=internal)
apiVersion: v1
kind: Secret
metadata:
  name: vm-autoscaler-secrets
type: Opaque
stringData:
  WEBHOOK_TOKEN: "CHANGE-ME-shared-with-grafana-contact-point"
  # GitLab project access token, scope `api`. Role Developer (merge_request mode) or
  # Maintainer (direct_commit to a protected branch). See README "GitLab mode".
  GITLAB_TOKEN: "CHANGE-ME-gitlab-project-access-token"
  GITOPS_API_TOKEN: "CHANGE-ME-scoped-to-vmstorage-components-only"  # only for GITOPS_BACKEND=internal
  ARGOCD_TOKEN: "CHANGE-ME-project-role-get-and-sync-only"
