apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-autoscaler
spec:
  # Exactly ONE replica: the per-target lock is in-process (asyncio.Lock), so a second
  # replica could commit/sync the same target at the same time. Optimistic concurrency
  # in the GitOps backend is a second line of defence, not the first. Recreate (not
  # RollingUpdate) so two pods never overlap during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vm-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vm-autoscaler
    spec:
      automountServiceAccountToken: false   # we never call the Kubernetes API
      # Shutdown budget (SIGTERM on rollout, node drain, eviction):
      #   preStop sleep 5s  -> the router/Service stops sending new webhooks to this pod
      #   uvicorn drains    -> up to 80s for an in-flight webhook to finish (Dockerfile
      #                        --timeout-graceful-shutdown 80), then closes HTTP clients
      #   90s total         -> only then does the kubelet send SIGKILL
      # The preStop time counts against this period, so keep 5 + 80 < 90.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vm-autoscaler
          image: vm-autoscaler
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vm-autoscaler-env
            - secretRef:
                name: vm-autoscaler-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/vm-autoscaler
              readOnly: true
            - name: internal-ca
              mountPath: /etc/pki/internal-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: vm-autoscaler-config
        - name: internal-ca
          configMap:
            name: vm-autoscaler-ca
            items:
              - key: ca-bundle.crt
                path: ca-bundle.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
