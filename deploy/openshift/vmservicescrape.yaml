# Alternative to servicemonitor.yaml when scraping with the VictoriaMetrics operator.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: vm-autoscaler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vm-autoscaler
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
