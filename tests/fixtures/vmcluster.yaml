# VictoriaMetrics cluster for region A. Managed by Argo CD.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-main-extra
data:
  note: "not the VMCluster"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: vm-main
  namespace: monitoring
  labels:
    team: observability   # owner
spec:
  retentionPeriod: "12"   # months
  replicationFactor: 2
  vmstorage:
    replicaCount: 3
    # Sized for ~5M active series per node
    resources:
      requests:
        cpu: "2"
        memory: 16Gi
      limits:
        cpu: "4"   # see capacity doc
        memory: 16Gi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: fast-ssd
          resources:
            requests:
              storage: 500Gi
    extraArgs:
      dedup.minScrapeInterval: 30s
  vmselect:
    replicaCount: 2
    resources:
      limits:
        cpu: 2
        memory: 8Gi
  vminsert:
    replicaCount: 2
    tolerations:
    - key: dedicated
      operator: Equal
      value: monitoring
      effect: NoSchedule
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: vm-other
spec:
  vmstorage:
    replicaCount: 2
